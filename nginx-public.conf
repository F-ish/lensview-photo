server {
    listen 80 default_server;
    server_name _;

    # 隐藏 Nginx 版本
    server_tokens off;

    # 日志配置
    access_log /var/log/nginx/lensview_access.log;
    error_log /var/log/nginx/lensview_error.log warn;

    # 限制请求大小（20MB 图片 + 余量）
    client_max_body_size 25M;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # 静态文件和 API 反向代理
    location / {
        # 应用限流
        limit_req zone=lensview_limit burst=10 nodelay;
        limit_conn lensview_conn 5;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # 安全响应头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data: blob:; connect-src 'self';" always;
    }

    # 登录接口（严格限流，防密码爆破）
    location /api/login {
        # 每分钟最多 3 次登录尝试
        limit_req zone=login_limit burst=2 nodelay;
        limit_conn lensview_conn 2;

        proxy_pass http://127.0.0.1:3000/api/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 安全头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 其他 API 接口
    location /api/ {
        limit_req zone=lensview_limit burst=10 nodelay;
        limit_conn lensview_conn 5;

        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # 安全头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # 图片资源（禁止执行脚本）
    location /images/ {
        proxy_pass http://127.0.0.1:3000/images/;
        proxy_cache_bypass $http_upgrade;

        # 图片缓存
        add_header Cache-Control "public, max-age=31536000";
        expires 1y;

        # 禁止脚本执行
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self';" always;
    }

    # 禁止访问隐藏文件和敏感文件
    location ~ /\. {
        deny all;
        return 404;
    }

    location ~* \.(git|svn|env|bak|old|tmp|log)$ {
        deny all;
        return 404;
    }
}
